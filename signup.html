</head>
<body>
<nav class="navbar" id="navbar">
<div class="container nav-container">
<a href="index.html" class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 20L20 4M20 4H8M20 4V16" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>neXa</a>

<section class="auth-section">
<div class="container auth-container">
<div class="auth-card">
<h1>Create Account</h1>
<p>Join neXa and start building smarter</p>
<form id="signupForm">
<div class="form-group"><label for="name">Full Name</label><input type="text" id="name" name="name" placeholder="Your name" required></div>
<div class="form-group"><label for="email">Email</label><input type="email" id="email" name="email" placeholder="Your email" required></div>
<div class="form-group"><label for="password">Password</label><input type="password" id="password" name="password" placeholder="Create password" required></div>
<div class="form-group"><label for="confirmPassword">Confirm Password</label><input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required></div>
<button type="submit" class="btn-primary">Sign Up</button>
</form>
<p class="auth-alt">Already have an account? <a href="login.html">Login</a></p>
</div>
</div>
</section>

<footer class="footer">
<div class="container">

</div>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyAPFtyR6CaesleHEwj3hC8Ziht9NwdxkLQ",authDomain:"chat-app-e379d.firebaseapp.com",projectId:"chat-app-e379d",storageBucket:"chat-app-e379d.firebasestorage.app",messagingSenderId:"1082025972243",appId:"1:1082025972243:web:73971b283640e4c1a5a5e6"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);
document.getElementById('signupForm').addEventListener('submit',function(e){e.preventDefault();const email=document.getElementById('email').value;const password=document.getElementById('password').value;const confirm=document.getElementById('confirmPassword').value;if(password!==confirm){alert('Passwords do not match!');return}createUserWithEmailAndPassword(auth,email,password).then(()=>{alert('Account created successfully!');window.location.href='dashboard.html'}).catch(error=>{alert('Error: '+error.message)})});
</script>
</body>
</html>
