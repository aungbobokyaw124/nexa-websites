<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Demo — neXa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0B1F3A;color:#fff;font-family:'Inter',sans-serif;min-height:100vh}
.nav{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:#0F2847}
.nav h1{color:#10B981;font-size:18px}
.hero{text-align:center;padding:60px 20px}
.hero h2{font-size:32px;margin-bottom:12px}
.hero p{color:#94A3B8}
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:24px;max-width:900px;margin:0 auto}
.svc{background:#0F2847;border:1px solid #1E3A5F;border-radius:12px;padding:24px;text-align:center}
.svc h3{color:#10B981;font-size:16px;margin-bottom:8px}
.svc p{color:#94A3B8;font-size:13px}
.contact{text-align:center;padding:40px;background:#0F2847;border-top:1px solid #1E3A5F}
.contact button{background:#10B981;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-weight:600;cursor:pointer}
.badge{position:fixed;top:80px;right:16px;background:rgba(16,185,129,.15);border:1px solid #10B981;color:#10B981;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600}
@media(max-width:768px){.services{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="badge">Template Demo</div>
<div class="nav"><h1>Company</h1><span style="color:#94A3B8">Business Template</span></div>
<div class="hero"><h2>Your Business Name</h2><p>Professional services for your needs</p></div>
<div class="services">
<div class="svc"><h3>Service 1</h3><p>Description</p></div>
<div class="svc"><h3>Service 2</h3><p>Description</p></div>
<div class="svc"><h3>Service 3</h3><p>Description</p></div>
</div>
<div class="contact"><button>Contact Us</button></div>
</body>
</html>
