<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Demo — neXa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0B1F3A;color:#fff;font-family:'Inter',sans-serif;min-height:100vh}
.hero{text-align:center;padding:80px 20px 40px}
.hero h1{font-size:36px;color:#10B981;margin-bottom:16px}
.hero p{color:#94A3B8;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:24px;max-width:900px;margin:0 auto}
.project{background:#0F2847;border:1px solid #1E3A5F;border-radius:12px;height:180px;display:flex;align-items:center;justify-content:center;color:#10B981;font-size:28px}
.badge{position:fixed;top:16px;right:16px;background:rgba(16,185,129,.15);border:1px solid #10B981;color:#10B981;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600}
@media(max-width:768px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="badge">Template Demo</div>
<div class="hero"><h1>Creative Portfolio</h1><p>Designer & Developer</p></div>
<div class="grid">
<div class="project">🎨</div>
<div class="project">💻</div>
<div class="project">📱</div>
<div class="project">🌐</div>
<div class="project">📊</div>
<div class="project">🤖</div>
</div>
</body>
</html>
