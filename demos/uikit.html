<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI Kit Demo — neXa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0B1F3A;color:#fff;font-family:'Inter',sans-serif;min-height:100vh;padding:24px}
.badge{position:fixed;top:16px;right:16px;background:rgba(16,185,129,.15);border:1px solid #10B981;color:#10B981;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600}
h1{text-align:center;color:#10B981;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.comp{background:#0F2847;border:1px solid #1E3A5F;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;min-height:100px}
.btn{background:#10B981;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-weight:600}
.input{padding:10px;background:#132F52;border:1px solid #1E3A5F;border-radius:8px;color:#fff;width:100%}
.card{width:100%;height:60px;background:#132F52;border-radius:8px}
@media(max-width:768px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="badge">Template Demo</div>
<h1>UI Kit Components</h1>
<div class="grid">
<div class="comp"><button class="btn">Button</button></div>
<div class="comp"><input class="input" placeholder="Input"></div>
<div class="comp"><div class="card"></div></div>
<div class="comp">🎨 Icon</div>
<div class="comp">📊 Chart</div>
<div class="comp">📝 Form</div>
<div class="comp">🧭 Nav</div>
<div class="comp">📱 Mobile</div>
</div>
</body>
</html>
