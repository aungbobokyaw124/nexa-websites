<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Lite Demo — neXa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0B1F3A;color:#fff;font-family:'Inter',sans-serif;min-height:100vh;display:flex}
.sidebar{width:200px;background:#0F2847;border-right:1px solid #1E3A5F;padding:16px;display:flex;flex-direction:column;gap:12px}
.sidebar h2{font-size:16px;color:#10B981;margin-bottom:8px}
.sidebar a{color:#94A3B8;text-decoration:none;font-size:13px;padding:8px;border-radius:6px}
.sidebar a:hover{background:#132F52;color:#fff}
.main{flex:1;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.header h1{font-size:20px}
.header button{background:#10B981;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer}
.table{background:#0F2847;border:1px solid #1E3A5F;border-radius:12px;overflow:hidden}
.row{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #1E3A5F}
.row:last-child{border-bottom:none}
.row span{color:#94A3B8;font-size:13px}
.badge{position:fixed;top:16px;right:16px;background:rgba(16,185,129,.15);border:1px solid #10B981;color:#10B981;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600}
@media(max-width:768px){body{flex-direction:column}.sidebar{width:100%;flex-direction:row;flex-wrap:wrap}}
</style>
</head>
<body>
<div class="badge">Template Demo</div>
<div class="sidebar">
<h2>Admin</h2>
<a href="#">Dashboard</a><a href="#">Users</a><a href="#">Orders</a><a href="#">Settings</a>
</div>
<div class="main">
<div class="header"><h1>Users</h1><button>Add User</button></div>
<div class="table">
<div class="row"><span>User 1</span><span>Active</span></div>
<div class="row"><span>User 2</span><span>Active</span></div>
<div class="row"><span>User 3</span><span>Inactive</span></div>
</div>
</div>
</body>
</html>
