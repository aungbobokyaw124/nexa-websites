<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-commerce Storefront — Demo</title><style>body{margin:0;background:#0B1F3A;color:#fff;font:14px Arial}header{padding:20px 5%;border-bottom:1px solid #1E3A5F;display:flex;justify-content:space-between}.wrap{padding:30px 5%}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.p{background:#132F52;border:1px solid #1E3A5F;border-radius:14px;padding:20px}.box{height:140px;background:#0F2847;border-radius:10px}.price{color:#10B981;font-size:20px;font-weight:bold}@media(max-width:700px){.products{grid-template-columns:1fr 1fr}}@media(max-width:450px){.products{grid-template-columns:1fr}}</style></head><body><header><b>neXa Store</b><span>Shop &nbsp; Cart (2)</span></header><main class="wrap"><h1>E-commerce Storefront</h1><p>Modern product grid, cart and checkout experience.</p><div class="products"><div class="p"><div class="box"></div><h3>Premium Product</h3><p>Modern digital product</p><span class="price">$29</span></div><div class="p"><div class="box"></div><h3>Starter Product</h3><p>Simple and useful</p><span class="price">$19</span></div><div class="p"><div class="box"></div><h3>Pro Product</h3><p>Advanced package</p><span class="price">$49</span></div></div></main></body></html>
