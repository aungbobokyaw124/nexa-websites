<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaaS Landing Demo — neXa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0B1F3A;color:#fff;font-family:'Inter',sans-serif;min-height:100vh}
.hero{text-align:center;padding:100px 20px 60px}
.hero h1{font-size:36px;margin-bottom:16px}
.hero p{color:#94A3B8;margin-bottom:24px}
.btn{background:#10B981;color:#fff;border:none;padding:14px 28px;border-radius:8px;font-weight:600;cursor:pointer}
.testimonials{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:24px;max-width:900px;margin:0 auto}
.test{background:#0F2847;border:1px solid #1E3A5F;border-radius:12px;padding:20px;text-align:center}
.test p{color:#94A3B8;font-size:13px;font-style:italic}
.pricing{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:24px;max-width:900px;margin:0 auto}
.plan{background:#0F2847;border:1px solid #1E3A5F;border-radius:12px;padding:24px;text-align:center}
.plan h3{font-size:18px;margin-bottom:8px}
.plan p{font-size:28px;color:#10B981;font-weight:700}
.badge{position:fixed;top:16px;right:16px;background:rgba(16,185,129,.15);border:1px solid #10B981;color:#10B981;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600}
@media(max-width:768px){.testimonials,.pricing{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="badge">Template Demo</div>
<div class="hero"><h1>SaaS Landing Pro</h1><p>Premium SaaS landing template</p><button class="btn">Start Trial</button></div>
<div class="testimonials">
<div class="test"><p>"Great product!"</p></div>
<div class="test"><p>"Very useful."</p></div>
<div class="test"><p>"Highly recommend."</p></div>
</div>
<div class="pricing">
<div class="plan"><h3>Basic</h3><p>$9</p></div>
<div class="plan"><h3>Pro</h3><p>$29</p></div>
<div class="plan"><h3>Enterprise</h3><p>$99</p></div>
</div>
</body>
</html>
