<section class="dashboard-section">

<footer class="footer">

<script>
const hamburger=document.getElementById('hamburger');
const navLinks=document.getElementById('navLinks');
hamburger.addEventListener('click',()=>{navLinks.classList.toggle('active')});
document.querySelectorAll('.nav-links a').forEach(link=>{link.addEventListener('click',()=>{navLinks.classList.remove('active')})});
</script>
<script type="module">

const firebaseConfig={apiKey:"AIzaSyAPFtyR6CaesleHEwj3hC8Ziht9NwdxkLQ",authDomain:"chat-app-e379d.firebaseapp.com",projectId:"chat-app-e379d",storageBucket:"chat-app-e379d.firebasestorage.app",messagingSenderId:"1082025972243",appId:"1:1082025972243:web:73971b283640e4c1a5a5e6"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);
